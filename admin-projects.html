<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت پروژه‌های مرتکس</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://xpkckkosnnixshbarieo.supabase.co; connect-src 'self' https://xpkckkosnnixshbarieo.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://xpkckkosnnixshbarieo.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="css/admin.css">
<script src="js/config.js" defer></script>
<script src="js/projects.js" defer></script>
</head>
<body>

<!-- ورود -->
<main class="ad-login" id="adLogin">
  <form class="ad-card ad-login-card" id="adLoginForm" autocomplete="on">
    <div class="ad-brand"><img src="assets/ms-logo-64.webp" width="48" height="48" alt=""><div><div class="ad-kicker">ADMIN</div><h1>ورود مدیر</h1></div></div>
    <p class="ad-muted">برای مشاهده و مدیریت سفارش‌ها، گفتگوها و پروژه‌ها وارد شوید.</p>
    <label class="ad-field"><span>ایمیل مدیر</span>
      <input id="adEmail" type="email" required autocomplete="username" dir="ltr" inputmode="email"></label>
    <label class="ad-field"><span>رمز عبور</span>
      <span class="ad-pass"><input id="adPass" type="password" required autocomplete="current-password" dir="ltr">
      <button type="button" id="adPassToggle" class="ad-ghost" aria-label="نمایش رمز عبور" aria-pressed="false">👁</button></span></label>
    <div class="ad-error" id="adLoginError" role="alert" hidden></div>
    <button class="ad-btn ad-primary" type="submit" id="adLoginBtn">ورود</button>
    <a class="ad-btn ad-back" href="index.html">→ بازگشت به صفحه اصلی</a>
  </form>
</main>

<!-- داشبورد -->
<div class="ad-app" id="adApp" hidden>
  <header class="ad-top">
    <div class="ad-brand"><img src="assets/ms-logo-64.webp" width="40" height="40" alt=""><div><div class="ad-kicker">ADMIN DASHBOARD</div><h1>مدیریت پروژه‌ها</h1></div></div>
    <div class="ad-top-actions">
      <a class="ad-btn ad-back" href="index.html">→ صفحه اصلی</a>
      <button class="ad-btn" id="adRefresh" type="button">↻ بازخوانی</button>
      <button class="ad-btn" id="adLogout" type="button">خروج</button>
    </div>
  </header>

  <nav class="ad-tabs" aria-label="بخش‌های پنل">
    <a class="ad-tab" href="admin.html#orders">📦 سفارش‌ها</a>
    <a class="ad-tab" href="admin.html#chats">💬 گفتگوها</a>
    <a class="ad-tab is-on" href="admin-projects.html" aria-current="page">🖼️ پروژه‌ها</a>
    <a class="ad-tab" href="admin.html#comments">💭 نظرات</a>
  </nav>

  <!-- پروژه‌ها -->
  <section id="paneProjects" class="ad-pane">
    <form class="ad-card" id="projForm">
      <div class="ad-card-head"><strong>افزودن پروژه</strong><span class="ad-muted">نام پروژه و ۱ تا ۳۰ عکس (عکس‌ها خودکار بهینه و فشرده می‌شوند)</span></div>
      <label class="ad-field"><span>نام پروژه</span><input id="projName" type="text" maxlength="100" required placeholder="مثلاً طراحی سایت فروشگاهی"></label>
      <label class="ad-field"><span>توضیح کوتاه (اختیاری، حداکثر ۳۰۰ حرف)</span><textarea id="projDesc" maxlength="300" rows="2" placeholder="مثلاً: سایت معرفی و فروش برای یک کسب‌وکار کوچک؛ طراحی ریسپانسیو و سریع"></textarea></label>
      <label class="ad-field"><span>لینک سایت (اختیاری)</span><input id="projUrl" type="url" dir="ltr" maxlength="300" placeholder="https://example.com"></label>
      <label class="ad-field"><span>عکس‌های پروژه</span><input id="projFiles" type="file" accept="image/*" multiple></label>
      <div class="ad-muted" id="projInfo">هنوز عکسی انتخاب نشده است.</div>
      <div class="ad-previews" id="projPreview"></div>
      <div class="ad-progress" id="projProgress" hidden><i></i><span></span></div>
      <div class="ad-actions"><button class="ad-btn ad-primary" id="projSave" type="submit">➕ افزودن پروژه</button><button class="ad-btn" id="projReset" type="button">پاک کردن</button></div>
    </form>
    <div class="ad-list" id="projList"></div>
  </section>

</div>

<div class="ad-toast" id="adToast" role="status" aria-live="polite"></div>
</body>
</html>
