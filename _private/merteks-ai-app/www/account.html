<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>حساب کاربری | مرتکس</title>
  <meta name="description" content="حساب کاربری شما در گروه مرتکس.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101827">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://xpkckkosnnixshbarieo.supabase.co; connect-src 'self' https://xpkckkosnnixshbarieo.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://xpkckkosnnixshbarieo.supabase.co" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&amp;display=swap">
  <link rel="preload" as="image" href="assets/ms-logo-256.webp" type="image/webp">
  <link rel="stylesheet" href="css/style.css?v=16">
  <link rel="stylesheet" href="css/auth.css?v=17">
  <script src="js/config.js?v=16" defer></script>
  <script src="js/auth.js?v=19" defer></script>
</head>

<body class="ob-page" data-auth-page="account">
  <main class="ob-in" id="mxDeck">
    <a class="ob-back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>بازگشت به سایت</a>
    <img class="ob-logo" src="assets/ms-logo-256.webp" width="96" height="96" alt="">
    <h1>حساب <span>مرتکس</span> شما</h1>
    <p class="ob-lead">همین حساب در اپ Merteks AI هم کار می‌کند.</p>
    <div class="ob-alert" id="authAlert" role="alert" hidden></div>

    <div id="accountPage" hidden>
      <section class="ob-card" aria-label="اطلاعات حساب">
        <dl class="ob-profile">
          <div><dt>نام کاربری</dt><dd id="acName">…</dd></div>
          <div><dt>شمارهٔ موبایل</dt><dd dir="ltr" id="acPhone">…</dd></div>
          <div><dt>تاریخ عضویت</dt><dd id="acSince">…</dd></div>
        </dl>
      </section>

      <form class="ob-form" id="nameForm" novalidate>
        <h2>تغییر نام کاربری</h2>
        <label for="anName">نام کاربری</label>
        <div class="ob-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input id="anName" name="name" autocomplete="nickname" maxlength="30" aria-describedby="anErr">
        </div>
        <p class="ob-err" id="anErr" role="alert"></p>
        <p class="ob-ok" id="anOk" role="status"></p>
        <button class="ob-btn ghost" type="submit">ذخیرهٔ نام</button>
      </form>

      <form class="ob-form" id="passForm" novalidate>
        <h2>تغییر رمز عبور</h2>
        <label for="apOld">رمز عبور فعلی</label>
        <div class="ob-field pw">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <input id="apOld" name="password" type="password" autocomplete="current-password" dir="ltr" maxlength="72" aria-describedby="apErr">
          <button class="ob-eye" type="button" aria-label="نمایش رمز عبور" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <label for="apNew">رمز عبور جدید</label>
        <div class="ob-field pw">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <input id="apNew" name="new-password" type="password" autocomplete="new-password" dir="ltr" maxlength="72" aria-describedby="apHint apErr">
          <button class="ob-eye" type="button" aria-label="نمایش رمز عبور" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <label for="apNew2">تکرار رمز عبور جدید</label>
        <div class="ob-field pw">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <input id="apNew2" name="new-password-2" type="password" autocomplete="new-password" dir="ltr" maxlength="72" aria-describedby="apErr">
          <button class="ob-eye" type="button" aria-label="نمایش رمز عبور" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <p class="ob-hint" id="apHint">دست‌کم ۸ نویسه، شامل حرف و عدد. با تغییر رمز، ورود شما روی دستگاه‌های دیگر بسته می‌شود.</p>
        <p class="ob-err" id="apErr" role="alert"></p>
        <p class="ob-ok" id="apOk" role="status"></p>
        <button class="ob-btn ghost" type="submit">تغییر رمز عبور</button>
      </form>

      <button class="ob-btn bad" id="acLogout" type="button">خروج از حساب</button>
    </div>
  </main>
</body>

</html>
