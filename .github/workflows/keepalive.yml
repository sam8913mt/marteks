# Keeps the free Supabase project awake (it pauses after ~1 week without activity)
# and keeps THIS workflow alive (GitHub disables scheduled workflows after 60 days
# without any commit in the repository).
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read one row
        run: |
          curl -fsS "https://xpkckkosnnixshbarieo.supabase.co/rest/v1/projects?select=id&limit=1" \
            -H "apikey: sb_publishable_TboHxYoN_qQLAzZTuRErvw_nbDP5TZW"
      - name: Keep this workflow enabled (empty commit if last commit is older than 45 days)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi
