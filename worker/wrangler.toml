name = "merteks-ai"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Model name. Override here if Google retires the alias.
GEMINI_MODEL = "gemini-flash-latest"
# Comma-separated list of exact site origins allowed to call this worker.
# Exact origin of the site: scheme + host only (no /marteks path, no trailing slash).
ALLOWED_ORIGINS = "https://sam8913mt.github.io"

# The secret GEMINI_API_KEY is NOT set here. Set it with:  npx wrangler secret put GEMINI_API_KEY
